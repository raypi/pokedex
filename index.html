<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/mainpage.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/overlay.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <script src="./script/script.js"></script>
    <script src="./script/render.js"></script>
    <link rel="icon" href="favicon.ico" sizes="48x48">
</head>
<body onload="init()">
    <div class="content">
        <header>
             <div class="header-content">
                <a href="#" onclick="reStart()">
                    <img src="./assets/img/PokeLogo.png" alt="Logo der Pokedex Seite" class="header-logo">
                </a>
                <div>
                    <h1>Pokedex</h1>
                </div>
                <div class="search-Area">
                    <input type="text" name="user" id="searchPoke" placeholder="Poke suchen">
                    <button type="submit" onclick="searchPoke()" >suchen</button>
                </div>
            </div>    
        </header>
        <main>
            <section class="main-contend">
                <div id="content" class="content-main">
                </div>
            </section>
            <section>
                <div id="buttonContainer" class="button-container"></div>
            </section>
            <section>
                <div id="overlay" class="overlay" onclick="closeBigCard(event)">
                    <div id="big-card-container" class="big-card-container">  
                    </div>
                </div>
            </section>
        </main> 
        <footer>
            <div class="footer-content">2025 by Ray Don</div>
        </footer>
    </div>
</body>
</html>
