<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/mainpage.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/overlay.css">
    <script src="./script/script.js"></script>
    <script src="./script/database.json"></script>
    <script src="./script/render.js"></script>
    <link rel="icon" href="favicon.ico" sizes="48x48">
</head>
<body onload="init()">
    <header>
        <img src="./assets/img/PokeLogo.png" alt="Logo der Pokedex Seite" class="header-logo" >
        <div><h1>Pokedex</h1></div>
        <div class="search-Area">
            <input type="text" name="user" id="searchPoke" placeholder="Poke suchen">
            <button type="submit" onclick="handleSearchPoke()" >suchen</button>
        </div>   
    </header>
    <main>
        <section class="main-contend">
            <div id="content" class="content-main">
            </div>
        </section>

        <section>
            <div id="buttonContainer"></div>
        </section>
        <section>
            <div id="overlay" class="overlay" onclick="closeBigCard(event)">
                <div id="big-card-container" class="big-card-container">  
                </div>
            </div>
        </section>
    </main> 
    <footer>
        <div>2025 by Ray Don</div>
    </footer>
    
</body>
</html>
