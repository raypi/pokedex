<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/mainpage.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/overlay.css">
    <script src="./script/script.js"></script>
    <script src="./script/database.json"></script>
</head>
<body onload="init()">
    <header>
        <div><h1>Pokedex</h1></div>
        <div class="search-Area">
            <input type="text" name="user" id="searchPoke" placeholder="Poke suchen">
            <button type="submit">suchen</button>
        </div>   
    </header>
    <main>
        <section class="main-contend">
            <div id="content" class="content-main">
                <!-- Hier kommen die Pokémon-Karten rein -->
            </div>
        </section>

        <section>
            <div id="buttonContainer"></div> <!-- Container für den "Load More"-Button -->
        </section>

        <div id="loading-overlay" class="loading-overlay">
            <div class="spinner"></div>
        </div>
    </main> 
    <footer>
        <div>2025 by Ray Don</div>
    </footer>
    
</body>
</html>
